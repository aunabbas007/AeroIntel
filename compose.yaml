services:
  api:
    build:
      context: .
    image: aerointel-api:local
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}

      GOOGLE_API_KEY: ${GOOGLE_API_KEY:?Set GOOGLE_API_KEY in .env}
      GROQ_API_KEY: ${GROQ_API_KEY:?Set GROQ_API_KEY in .env}
      GROQ_MODEL: ${GROQ_MODEL:-groq/openai/gpt-oss-120b}

      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-480}

      PINECONE_API_KEY: ${PINECONE_API_KEY:?Set PINECONE_API_KEY in .env}
      PINECONE_INDEX_NAME: ${PINECONE_INDEX_NAME:-aerointel-v2}
      PINECONE_CLOUD: ${PINECONE_CLOUD:-aws}
      PINECONE_REGION: ${PINECONE_REGION:-us-east-1}
      PINECONE_INDEX_READY_TIMEOUT: ${PINECONE_INDEX_READY_TIMEOUT:-180}

      AEROINTEL_RETRIEVAL_MODE: ${AEROINTEL_RETRIEVAL_MODE:-dense}
      AEROINTEL_RETRIEVAL_K: ${AEROINTEL_RETRIEVAL_K:-3}
      AEROINTEL_RERANKER_ENABLED: ${AEROINTEL_RERANKER_ENABLED:-false}
      AEROINTEL_RERANKER_MODEL: ${AEROINTEL_RERANKER_MODEL:-cross-encoder/ms-marco-MiniLM-L-6-v2}
      AEROINTEL_CACHE_VERSION: ${AEROINTEL_CACHE_VERSION:-v2}
      REDIS_CACHE_TTL_SECONDS: ${REDIS_CACHE_TTL_SECONDS:-3600}

      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "127.0.0.1:${AEROINTEL_HOST_PORT:-8000}:8000"
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"
      interval: 30s
      timeout: 5s
      start_period: 300s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
