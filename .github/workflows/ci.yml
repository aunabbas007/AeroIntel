name: AeroIntel CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Run automated tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        env:
          JWT_SECRET_KEY: "ci-test-only-secret-not-for-production"
          DATABASE_URL: "sqlite:///./ci_test.db"
        run: python -m pytest -q

      - name: Validate database migrations
        env:
          DATABASE_URL: "sqlite:///./ci_migrations.db"
        run: python -m alembic upgrade head

      - name: Build production container
        run: docker build --tag aerointel-api:ci .

  deploy:
    name: Build, publish, and deploy to EC2
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    env:
      AWS_REGION: ap-southeast-2
      ECR_REPOSITORY: aerointel-api
      EC2_INSTANCE_ID: i-089772429b5e803aa

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push commit-tagged image
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker build --pull --tag "$IMAGE_URI" .
          docker push "$IMAGE_URI"
          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Deploy through Systems Manager
        env:
          IMAGE_URI: ${{ steps.image.outputs.image_uri }}
        run: |
          SCRIPT_B64="$(base64 -w 0 deploy/deploy-ec2.sh)"
          export SCRIPT_B64
          PARAMETERS="$(python -c 'import json,os; print(json.dumps({"commands": ["echo " + os.environ["SCRIPT_B64"] + " | base64 -d | sudo bash -s -- " + os.environ["IMAGE_URI"]]}))')"
          COMMAND_ID="$(aws ssm send-command             --instance-ids "$EC2_INSTANCE_ID"             --document-name "AWS-RunShellScript"             --comment "Deploy AeroIntel image $GITHUB_SHA"             --parameters "$PARAMETERS"             --query 'Command.CommandId'             --output text)"

          echo "SSM command: $COMMAND_ID"
          for attempt in $(seq 1 90); do
            STATUS="$(aws ssm get-command-invocation               --command-id "$COMMAND_ID"               --instance-id "$EC2_INSTANCE_ID"               --query 'Status'               --output text 2>/dev/null || true)"
            case "$STATUS" in
              Success)
                aws ssm get-command-invocation                   --command-id "$COMMAND_ID"                   --instance-id "$EC2_INSTANCE_ID"                   --query 'StandardOutputContent'                   --output text
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation                   --command-id "$COMMAND_ID"                   --instance-id "$EC2_INSTANCE_ID"                   --query '{Status:Status,Error:StandardErrorContent,Output:StandardOutputContent}'                   --output json
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "Timed out waiting for SSM deployment command $COMMAND_ID"
          exit 1
